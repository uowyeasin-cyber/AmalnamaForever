name: Refresh videos & Mazlum Corner
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-feeds
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-videos.mjs
      - run: node tools/build-mazlum.mjs
      - name: Commit if changed
        run: |
          git config user.name "amalnama-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos.json mazlum.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh videos and Mazlum Corner"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
