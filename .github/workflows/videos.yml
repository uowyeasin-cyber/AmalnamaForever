name: Refresh Islamic videos
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-videos.mjs
      - name: Commit if changed
        run: |
          git config user.name "amalnama-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "Refresh videos" && git push)
